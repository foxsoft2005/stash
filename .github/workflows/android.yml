# Builds and tests every pull request and every push to main.
# A PR is ready to merge when this check is green.
name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button on the Actions tab

# A new push to the same PR cancels the run that's still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: CI never pushes, comments or changes the repo.
permissions:
  contents: read

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # gradle/gradle-daemon-jvm.properties asks for Java 25; installing it here
      # avoids Gradle downloading a JDK on every run.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Caches Gradle downloads and build outputs between runs. Only pushes to main
      # write the cache (setup-gradle's default), so a PR can't poison builds of main.
      # "basic" = the open-source provider on top of GitHub's own cache: free for
      # private repos. The default "enhanced" provider is closed-source, only a free
      # preview for private repos, and sends cache metadata to Gradle.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Release is built too (unsigned, so no secrets needed): it runs R8 code
      # shrinking, which can fail on things a debug build never touches.
      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      # The build regenerates app/schemas/. If that changed anything, the PR
      # changed the database without committing the new schema (needed for
      # migrations), so fail with instructions instead of letting it slip by.
      - name: Room schema is committed
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "::error title=Room schema not committed::Build changed app/schemas/. Build locally and commit the files below with this PR."
            git status --porcelain -- app/schemas
            git diff -- app/schemas
            exit 1
          fi

      # One-line results on the run and the PR, and a guard against "green but
      # tested nothing" (e.g. a filter or source-set change that skips all tests).
      - name: Summarize tests and lint
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          from collections import Counter
          tests = failed = skipped = 0
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              tests += int(r.get("tests", 0))
              failed += int(r.get("failures", 0)) + int(r.get("errors", 0))
              skipped += int(r.get("skipped", 0))
          lint = Counter()
          lint_ids = Counter()
          lint_reports = glob.glob("app/build/reports/lint-results-debug.xml")
          for f in lint_reports:
              for issue in ET.parse(f).getroot().iter("issue"):
                  lint[issue.get("severity")] += 1
                  lint_ids[issue.get("id")] += 1
          if not lint_reports:
              lint_text = "no report found"
          else:
              lint_text = ", ".join(f"{n} {sev.lower()}" for sev, n in lint.most_common()) or "no issues"
              if lint_ids:
                  lint_text += " (" + ", ".join(f"{i} ×{n}" for i, n in lint_ids.most_common(8)) + ")"
          print(f"::notice title=Unit tests::{tests} run, {failed} failed, {skipped} skipped")
          print(f"::notice title=Lint::{lint_text}")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### Results\n| | |\n|---|---|\n| Unit tests | {tests} run, {failed} failed, {skipped} skipped |\n| Lint | {lint_text} |\n")
          if tests == 0:
              print("::error title=No tests ran::testDebugUnitTest produced no results")
              raise SystemExit(1)

      # Download from the run's Summary page and install with:
      #   adb install -r app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: stash-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      # R8 renames classes in release builds; this file turns crash stack traces
      # back into real names (Android Studio: Build › Analyze APK… › Load mapping,
      # or `retrace mapping.txt crash.txt`).
      - name: Upload release mapping
        uses: actions/upload-artifact@v7
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
          if-no-files-found: error

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          retention-days: 14
          if-no-files-found: ignore
