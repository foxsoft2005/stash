# Publishes a signed APK as a GitHub Release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# Tags: vX.Y.Z, or vX.Y.Z-beta.N / -rc.N for pre-releases. Setup: RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

# Needed to create the release; nothing else is writable.
permissions:
  contents: write

# Never run two releases at once, and never cancel one halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Signing secrets live in this environment, which only v* tags may use
    # (Settings › Environments › release), so no branch or PR can read them.
    environment: release

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to check the tag is on main

      - name: Read version from tag
        id: version
        shell: python
        run: |
          import os, re
          tag = os.environ["GITHUB_REF_NAME"]
          m = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)(?:-(beta|rc)\.(\d+))?", tag)
          if not m:
              raise SystemExit(f"::error title=Bad tag::'{tag}' is not vX.Y.Z or vX.Y.Z-beta.N / -rc.N")
          major, minor, patch = (int(m[i]) for i in (1, 2, 3))
          pre = m[4] is not None
          n = int(m[5]) if pre else 0
          if minor > 99 or patch > 99:
              raise SystemExit("::error title=Bad tag::minor and patch must be ≤ 99")
          if (m[4] == "beta" and not 1 <= n <= 49) or (m[4] == "rc" and not 1 <= n <= 48):
              raise SystemExit("::error title=Bad tag::use beta.1–beta.49 or rc.1–rc.48")
          # Last two digits: beta.N = N, rc.N = 50+N, final = 99. So codes always rise:
          # v1.2.3-beta.2 -> 1020302, v1.2.3-rc.1 -> 1020351, v1.2.3 -> 1020399, v1.2.4-beta.1 -> 1020401
          stage = n if m[4] == "beta" else 50 + n if m[4] == "rc" else 99
          code = (major * 10_000 + minor * 100 + patch) * 100 + stage
          name = tag[1:]
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"STASH_VERSION_NAME={name}\nSTASH_VERSION_CODE={code}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"name={name}\ncode={code}\nprerelease={'true' if pre else 'false'}\n")
          print(f"Version {name} (code {code}){' pre-release' if pre else ''}")

      - name: Tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Not on main::Release tags must point at a commit that's on main (merged and tested)."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STASH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error title=No signing key::Secret STASH_KEYSTORE_BASE64 is missing. See RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "STASH_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build signed APK
        env:
          STASH_KEYSTORE_PASSWORD: ${{ secrets.STASH_KEYSTORE_PASSWORD }}
          STASH_KEY_ALIAS: ${{ secrets.STASH_KEY_ALIAS }}
          STASH_KEY_PASSWORD: ${{ secrets.STASH_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Verify signature, name files, write notes
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          # Public fingerprint of the release key (also in README › Install).
          RELEASE_CERT_SHA256: cb56a5796955715cf01eb4f1f1341d3b26f7e8e87dbaf677cf3744c207ceb491
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error title=Unsigned build::No signed APK was produced; check the signing secrets."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/signature.txt"
          # The signer's certificate fingerprint: the 64 hex digits on the
          # "certificate SHA-256 digest" line (not the public-key digest).
          cert=$(grep -i 'certificate SHA-256 digest' "$RUNNER_TEMP/signature.txt" | grep -oiE '[0-9a-f]{64}' | head -1 | tr 'A-F' 'a-f')
          if [ -z "$cert" ]; then
            echo "::error title=No certificate fingerprint::Couldn't read the signing certificate's SHA-256 from apksigner. Output above."
            exit 1
          fi
          echo "Signing certificate SHA-256: $cert"
          # Never publish an APK signed with anything but the real release key
          # (e.g. the debug-key fallback if signing were misconfigured).
          if [ "$cert" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error title=Wrong signing key::APK is signed with $cert, expected the release certificate $RELEASE_CERT_SHA256 (README › Install). Not publishing."
            exit 1
          fi

          out="stash-$NAME.apk"
          cp "$apk" "$out"
          # Kept with the release forever, to decode crash reports from this exact build.
          cp app/build/outputs/mapping/release/mapping.txt "stash-$NAME-mapping.txt"
          sha256sum "$out" > "$out.sha256"
          sha=$(cut -d' ' -f1 "$out.sha256")

          changes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body)
          {
            echo "## Install"
            echo "Download **$out** below and open it on your phone (allow *Install unknown apps* for your browser or file manager)."
            echo "To get updates automatically, add this repository to [Obtainium](https://github.com/ImranR98/Obtainium)."
            echo
            echo "Version $NAME (versionCode $CODE). Requires Android 8.0+."
            echo
            echo "## Verify"
            echo '| | SHA-256 |'
            echo '|---|---|'
            echo "| APK file | \`$sha\` |"
            echo "| Signing certificate | \`$cert\` |"
            echo
            echo "The signing certificate is the same for every Stash release; if it ever differs, don't install."
            echo
            echo "$changes"
          } > "$RUNNER_TEMP/notes.md"
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.files.outputs.apk }}
          NAME: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" "stash-$NAME-mapping.txt" \
            --verify-tag \
            --title "Stash $NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
