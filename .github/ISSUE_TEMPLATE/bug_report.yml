name: Bug report
description: Something in Stash doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this!

        **Privacy first:** issues here are public. Please don't attach photos of your
        belongings, backup (`.stash`) files or passwords, and leave out place names you'd
        rather not share. Screenshots are welcome if nothing private is visible.

        Found a security problem? Please don't file it here: use
        [private reporting](https://github.com/foxsoft2005/stash/security/advisories/new) instead.

  - type: input
    id: version
    attributes:
      label: Stash version
      description: "Android **Settings › Apps › Stash**, the version is at the bottom of the page."
      placeholder: 0.1.0-beta.4
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - GitHub release APK
        - Obtainium
        - Built from source / debug APK
    validations:
      required: true

  - type: input
    id: phone
    attributes:
      label: Phone model
      placeholder: Pixel 8
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android version
      description: "**Settings › About phone › Android version**"
      placeholder: "15"
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - Russian
    validations:
      required: true

  - type: dropdown
    id: ai
    attributes:
      label: Photo suggestions come from
      description: "The line under the photo on the item screen says which: *Suggested by Gemini Nano* or *Suggested by on-device image labels*."
      options:
        - Gemini Nano
        - On-device image labels
        - Don't know
        - Not related to this bug
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest way to make it happen again.
      placeholder: |
        1. Open Stash
        2. Long-press an item, tap Move to…
        3. …
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message (optional)
      description: If Stash showed an error or closed unexpectedly, paste the message here.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag images here. Check that nothing private is visible.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no photos of my belongings, backup files or passwords.
          required: true
